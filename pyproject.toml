[project]
name = "meeting-scribe"
version = "0.2.0"
description = "Record a Google Meet, get a live Thai transcript with speaker labels, and post an AI meeting summary to Discord."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "davey>=0.1.7",
    "discord-ext-voice-recv==0.5.2a179",
    "discord-py[voice]>=2.7.1",
    "fastapi>=0.141.1",
    "fpdf2>=2.8.9",
    "google-adk==2.11.0",
    "google-cloud-firestore==2.34.1",
    "google-cloud-pubsub==2.42.0",
    "google-cloud-storage>=3.17.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "line-bot-sdk==3.26.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "slack-bolt==1.30.0",
    "tzdata>=2026.5",
    "uharfbuzz>=0.56.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["meeting_scribe", "salid"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits real Vertex Gemini (deselected by default; run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# Long prompt strings are clearer unwrapped; the formatter handles code width.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends"]
