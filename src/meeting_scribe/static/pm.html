<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salid Projects</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --bg:#F3F4F7; --card:#fff; --ink:#171A21; --muted:#545B6E; --faint:#6A7183;
  --line:#DCDFE8; --line-soft:#ECEEF3; --navy:#1D2140; --accent:#4752C4; --link:#3F49B8;
  --on-accent:#fff; --nav-active:#E3E5F6;
  --ok-bg:#DDF3E8; --ok-ink:#0B6B45; --warn-bg:#FFF1D6; --warn-ink:#8A5A00;
  --err-bg:#FDE7E4; --err-ink:#A12315; --soon-bg:#ECEEF3; --chip:#EEF0FB; --shadow:0 8px 30px rgba(20,24,50,.18);
  --c1:#4752C4; --c2:#2B7A78; --c3:#C77D0A; --c4:#A12315; --c5:#7B68EE; --c6:#6A7183;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#10121A; --card:#181B27; --ink:#E9EBF5; --muted:#A5ACC4; --faint:#8E96B0;
    --line:#2C3045; --line-soft:#232739; --navy:#0B0D16; --accent:#7C87F0; --link:#9CA6FF;
    --on-accent:#10121A; --nav-active:#252A47;
    --ok-bg:#12382A; --ok-ink:#7AE0B0; --warn-bg:#40300D; --warn-ink:#F3C969;
    --err-bg:#46201B; --err-ink:#FFA99B; --soon-bg:#232739; --chip:#232A4A; --shadow:0 8px 30px rgba(0,0,0,.5);
    --c1:#7C87F0; --c2:#5BC3BF; --c3:#F3C969; --c4:#FFA99B; --c5:#A99CFF; --c6:#8E96B0;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); line-height:1.55; overflow-x:hidden; font-family:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif; }
a { color:var(--link); }
[hidden] { display:none !important; }
h1,h2,h3,p { margin:0; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.mark { width:34px; height:34px; border-radius:10px; background:#5865F2; color:#fff; display:grid; place-items:center; font-weight:700; font-size:17px; flex:none; }
.btn { background:var(--accent); color:var(--on-accent); border:1px solid var(--accent); border-radius:9px; padding:8px 16px; font-weight:600; min-height:40px; }
.btn.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
.btn.danger { background:transparent; color:var(--err-ink); border-color:var(--err-ink); }
.btn.sm { min-height:32px; padding:4px 12px; font-size:14px; }
.btn[disabled] { opacity:.55; cursor:not-allowed; }
label.f { display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--muted); min-width:0; }
input[type=text],input[type=email],input[type=search],input[type=date],input[type=number],input[type=url],input[type=datetime-local],select,textarea {
  background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 12px; min-height:40px; width:100%; color:var(--ink); }
input[disabled],select[disabled],textarea[disabled] { opacity:.7; }
textarea { resize:vertical; min-height:90px; }
.row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
.row > * { flex:1 1 150px; min-width:0; }
.row > .btn, .row > .fixed { flex:0 0 auto; }
.notice { padding:10px 14px; border-radius:10px; font-size:14px; background:var(--warn-bg); color:var(--warn-ink); }
.notice.error { background:var(--err-bg); color:var(--err-ink); }
.notice.ok { background:var(--ok-bg); color:var(--ok-ink); }
.badge { display:inline-block; padding:1px 10px; border-radius:99px; font-size:13px; font-weight:600; background:var(--soon-bg); color:var(--muted); white-space:nowrap; }
.badge.ok { background:var(--ok-bg); color:var(--ok-ink); } .badge.warn { background:var(--warn-bg); color:var(--warn-ink); } .badge.err { background:var(--err-bg); color:var(--err-ink); } .badge.info { background:var(--chip); color:var(--link); }
.muted { color:var(--muted); } .small { font-size:14px; }
.txt-err { color:var(--err-ink); font-weight:600; } .txt-warn { color:var(--warn-ink); font-weight:600; }

#login { min-height:100vh; display:flex; flex-wrap:wrap; }
#login .pitch { flex:1 1 420px; background:var(--navy); color:#EEF0FA; padding:48px 20px; display:flex; flex-direction:column; gap:22px; }
#login .pitch h1 { font-size:30px; line-height:1.3; max-width:520px; }
#login .pitch p { font-size:17px; color:#C5CAE8; max-width:500px; }
#login .panel { flex:1 1 360px; display:grid; place-items:center; padding:40px 16px; }
#login .box { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 22px; display:flex; flex-direction:column; gap:14px; }
#gsi-button { min-height:44px; display:flex; justify-content:center; }
.brand { display:flex; align-items:center; gap:10px; } .brand strong { font-size:18px; }

#topbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 16px; background:var(--navy); color:#EEF0FA; position:sticky; top:0; z-index:30; }
#topbar .sp { flex:1; }
#topbar select { width:auto; max-width:200px; min-height:34px; padding:3px 10px; }
#topbar .btn { color:#EEF0FA; border-color:#4a5080; }
#topbar a.btn { text-decoration:none; display:inline-flex; align-items:center; }
#shell { display:flex; min-height:calc(100vh - 52px); }
#nav { width:220px; flex:none; background:var(--card); border-right:1px solid var(--line); padding:14px 10px; display:flex; flex-direction:column; gap:2px; position:sticky; top:52px; height:calc(100vh - 52px); }
#nav a { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:var(--ink); text-decoration:none; }
#nav a:hover { background:var(--line-soft); }
#nav a[aria-current=page] { background:var(--nav-active); font-weight:600; }
#nav .ic { width:22px; text-align:center; }
#content { flex:1 1 auto; min-width:0; padding:22px 24px 90px; max-width:1200px; margin:0 auto; width:100%; }
h1.pt { font-size:26px; margin-bottom:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:space-between; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0; margin-bottom:16px; }
.card h2 { font-size:18px; }
.card h3 { font-size:15px; color:var(--muted); font-weight:600; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-bottom:16px; }
.grid > .card { margin-bottom:0; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
.grid2 > .card { margin-bottom:16px; }
.stat { font-size:30px; font-weight:700; line-height:1.2; }
.empty { text-align:center; color:var(--muted); padding:22px 12px; border:1px dashed var(--line); border-radius:12px; }
.skeleton { height:18px; border-radius:6px; background:linear-gradient(90deg,var(--line-soft),var(--line),var(--line-soft)); background-size:200% 100%; animation:sk 1.2s linear infinite; }
@keyframes sk { to { background-position:-200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation:none; } }
.li { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line-soft); min-width:0; flex-wrap:wrap; }
.li:last-child { border-bottom:0; }
.li .grow { flex:1 1 180px; min-width:0; overflow-wrap:anywhere; }
.li.warnrow { background:var(--warn-bg); border-radius:8px; padding-left:8px; padding-right:8px; }
.li input[type=date], .li select { width:auto; min-height:34px; padding:3px 8px; }
.li.done .grow { text-decoration:line-through; color:var(--muted); }
.check { display:inline-flex; align-items:center; gap:6px; min-height:32px; }
input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); flex:none; }
.tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; }
.tabs button, .chips button { background:transparent; border:1px solid var(--line); border-radius:99px; padding:5px 14px; white-space:nowrap; min-height:34px; }
.tabs button[aria-selected=true], .chips button[aria-pressed=true] { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
.chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.tbl { width:100%; border-collapse:collapse; font-size:15px; }
.tbl th { text-align:left; color:var(--muted); font-weight:500; font-size:13px; padding:6px 8px; border-bottom:1px solid var(--line); }
.tbl td { padding:8px; border-bottom:1px solid var(--line-soft); vertical-align:middle; overflow-wrap:anywhere; }
.tbl tr.click { cursor:pointer; } .tbl tr.click:hover td { background:var(--line-soft); }
.tblwrap { overflow-x:auto; }
.avatar { width:26px; height:26px; border-radius:50%; background:var(--chip); color:var(--accent); display:inline-grid; place-items:center; font-weight:700; font-size:13px; flex:none; }
.who { display:inline-flex; align-items:center; gap:6px; min-width:0; }
.dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; background:var(--c6); }
.dot.high { background:var(--c4); } .dot.medium { background:var(--c3); } .dot.low { background:var(--c2); }
.bar { height:10px; border-radius:99px; background:var(--line-soft); overflow:hidden; } .bar > i { display:block; height:100%; background:var(--accent); border-radius:99px; }
.bar.ok > i { background:var(--c2); } .bar.warn > i { background:var(--c3); }
.bar.st-on_track > i { background:var(--c2); } .bar.st-behind > i { background:var(--c3); } .bar.st-at_risk > i { background:var(--c4); } .bar.st-done > i { background:var(--c1); } .bar.st-no_deadline > i, .bar.time > i { background:var(--c6); }
.pbars { display:flex; flex-direction:column; gap:4px; } .pbars .pl { display:flex; align-items:center; gap:8px; font-size:13px; } .pbars .pl > span:first-child { width:64px; flex:none; color:var(--muted); } .pbars .pl .bar { flex:1; } .pbars .pl b { width:40px; text-align:right; font-weight:600; flex:none; }
.pst-on_track { color:var(--ok-ink); } .pst-behind { color:var(--warn-ink); } .pst-at_risk { color:var(--err-ink); } .pst-done, .pst-no_deadline { color:var(--muted); }
.pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }
.pcard { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; text-decoration:none; color:var(--ink); min-width:0; }
.pcard:hover { border-color:var(--accent); }
.pcard.review { border-color:var(--err-ink); }
.pcard .nm { font-weight:600; font-size:17px; overflow-wrap:anywhere; }
.meta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:14px; color:var(--muted); }
.bc { font-size:14px; margin-bottom:8px; }
.proj-hd { display:flex; flex-direction:column; gap:12px; }
.proj-hd input.title { font-size:22px; font-weight:700; border-color:transparent; background:transparent; padding-left:0; }
.proj-hd input.title:hover, .proj-hd input.title:focus { border-color:var(--line); background:var(--card); padding-left:12px; }
.md p { margin:0 0 8px; } .md ul { margin:0 0 8px; padding-left:20px; } .md h3,.md h4 { margin:8px 0 4px; } .md code { background:var(--line-soft); padding:1px 5px; border-radius:5px; }
.split { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
.donutwrap { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
.legend { display:flex; flex-direction:column; gap:4px; font-size:14px; }
.legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:middle; }
dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); padding:20px; width:min(480px,calc(100% - 32px)); }
dialog::backdrop { background:rgba(10,12,25,.5); }
dialog form { display:flex; flex-direction:column; gap:12px; }
details > summary { cursor:pointer; color:var(--link); font-size:14px; }
details[open] > summary { margin-bottom:8px; }
details .inner { display:flex; flex-direction:column; gap:12px; }
#toast { position:fixed; bottom:76px; left:50%; transform:translateX(-50%); z-index:70; max-width:calc(100% - 32px); }
#demobar { background:var(--warn-bg); color:var(--warn-ink); text-align:center; font-size:13px; padding:3px; }

@media (max-width:760px) {
  #shell { flex-direction:column; }
  #nav { position:fixed; z-index:40; bottom:0; left:0; right:0; top:auto; width:100%; height:auto; flex-direction:row; justify-content:space-around; padding:4px 4px calc(4px + env(safe-area-inset-bottom)); border-right:0; border-top:1px solid var(--line); gap:0; }
  #nav a { flex:1 1 0; flex-direction:column; gap:0; padding:5px 2px; font-size:11px; text-align:center; min-width:0; line-height:1.25; }
  #nav a span.lb { overflow:hidden; text-overflow:ellipsis; max-width:100%; display:block; }
  #content { padding:14px 14px 90px; }
  h1.pt { font-size:22px; }
  #login .pitch { padding:32px 16px; } #login .pitch h1 { font-size:25px; }
  .tbl.stack thead { display:none; }
  .tbl.stack tr { display:block; border-bottom:1px solid var(--line); padding:6px 0; }
  .tbl.stack td { display:block; border:0; padding:2px 4px; }
}
</style>
</head>

<div id="demobar" hidden>DEMO</div>
<section id="login" hidden>
  <div class="pitch">
    <div class="brand"><div class="mark" aria-hidden="true">S</div><strong>Salid Projects</strong></div>
    <h1 data-i="login_h"></h1>
    <p data-i="login_p"></p>
  </div>
  <div class="panel"><div class="box">
    <h2 data-i="login_title"></h2>
    <div id="login-msg" class="notice" role="alert" hidden></div>
    <div id="not-configured" class="notice error" hidden data-i="not_configured"></div>
    <div id="gsi-button"></div>
    <p class="muted small" data-i="login_note"></p>
    <button class="btn ghost sm" id="login-lang" type="button"></button>
  </div></div>
</section>

<div id="app" hidden>
  <header id="topbar">

</div>

<dialog id="dlg" aria-labelledby="dlg-t"><form method="dialog" id="dlg-form"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
