<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สลิด ศูนย์บัญชาการ · Salid Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #F3F4F7; --card: #fff; --ink: #171A21; --muted: #545B6E; --faint: #6A7183;
    --line: #DCDFE8; --line-soft: #ECEEF3; --navy: #1D2140; --accent: #4752C4; --link: #3F49B8;
    --ok-bg: #DDF3E8; --ok-ink: #0B6B45; --warn-bg: #FFF1D6; --warn-ink: #8A5A00;
    --soon-bg: #ECEEF3; --err-bg: #FDE7E4; --err-ink: #A12315; --chip: #EEF0FB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5;
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", Tahoma, sans-serif; }
  a { color: var(--link); } a:hover { color: #2C3590; }
  [hidden] { display: none !important; }
  h1, h2 { margin: 0; }
  button { font: inherit; cursor: pointer; }
  .mark { width: 36px; height: 36px; border-radius: 10px; background: #5865F2; color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }

  /* login */
  #login { min-height: 100vh; display: flex; flex-wrap: wrap; }
  #login .pitch { flex: 1 1 420px; background: var(--navy); color: #EEF0FA; padding: 48px 28px;
    display: flex; flex-direction: column; gap: 24px; }
  #login .pitch h1 { font-size: 34px; line-height: 1.3; max-width: 520px; }
  #login .pitch p { margin: 0; font-size: 17px; line-height: 1.7; color: #C5CAE8; max-width: 500px; }
  #login .pitch li { list-style: none; display: flex; gap: 12px; align-items: baseline; font-size: 16px; }
  #login .pitch ul { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  #login .pitch li span { font: 500 13px "IBM Plex Mono", monospace; color: #8E97E8; }
  #login .panel { flex: 1 1 360px; display: grid; place-items: center; padding: 40px 16px; }
  #login .box { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px; }
  #login .box h2 { font-size: 24px; }
  #login .box p { margin: 0; font-size: 15px; color: var(--muted); }
  #gsi-button { min-height: 44px; display: flex; justify-content: center; }
  .notice { padding: 10px 14px; border-radius: 10px; font-size: 14px; background: var(--warn-bg); color: var(--warn-ink); }
  .notice.error { background: var(--err-bg); color: var(--err-ink); }

  /* hub */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 16px;
    background: var(--navy); color: #EEF0FA; }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .brand strong { font-size: 18px; } header .brand span { font-size: 14px; color: #A9B0DA; }
  header .grow { flex: 1 1 auto; }
  header .who { font-size: 14px; color: #C5CAE8; overflow-wrap: anywhere; }
  header button { background: none; border: 0; color: #C5CAE8; font-size: 14px; text-decoration: underline; }
  .layout { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px 16px; max-width: 1360px; margin: 0 auto; }
  nav { flex: 1 1 180px; max-width: 240px; display: flex; flex-direction: column; gap: 4px; }
  nav a { padding: 9px 14px; border-radius: 8px; color: #3B4152; text-decoration: none; }
  nav a:first-child { background: #E3E5F6; color: var(--navy); font-weight: 600; }
  main { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  main h1 { font-size: 26px; line-height: 1.3; }
  section.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  section.card h2 { font-size: 19px; }
  .cols { display: flex; flex-wrap: wrap; gap: 20px; }
  .cols > section { flex: 1 1 340px; }
  .channels { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .ch { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .ch.soon { border-style: dashed; border-color: #C3C8D6; }
  .ch .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ch p { margin: 0; font-size: 14px; color: var(--muted); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--soon-bg); color: var(--muted); white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .feat { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
  .feat .txt { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; }
  .feat .txt span { font-size: 14px; color: var(--muted); }
  .where { font: 500 13px "IBM Plex Mono", monospace; color: var(--link); background: var(--chip); padding: 4px 10px; border-radius: 8px; }
  .switch { width: 52px; height: 30px; border-radius: 99px; border: 0; padding: 3px; background: #B9BECC;
    display: flex; justify-content: flex-start; flex: none; }
  .switch[aria-pressed="true"] { background: var(--accent); justify-content: flex-end; }
  .switch:disabled { background: #D5D8E1; cursor: not-allowed; }
  .switch i { width: 24px; height: 24px; border-radius: 50%; background: #fff; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 14px; }
  label small { font-weight: 400; color: var(--faint); }
  input[type=text], input[type=time] { min-height: 44px; padding: 0 12px; border: 1px solid #C9CDD9;
    border-radius: 10px; font: inherit; font-size: 15px; width: 100%; }
  .btn { min-height: 44px; padding: 0 22px; border-radius: 10px; border: 0; background: var(--accent);
    color: #fff; font-weight: 600; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.discord { background: #5865F2; } .btn.discord:hover { color: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .hint { font-size: 13px; color: var(--faint); }
  .chat { display: flex; flex-direction: column; gap: 10px; background: #F6F7FA; border-radius: 12px; padding: 14px; min-height: 80px; max-height: 420px; overflow-y: auto; }
  .bubble { max-width: 88%; padding: 10px 14px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.me { align-self: flex-end; background: var(--accent); color: #fff; border-radius: 12px 12px 4px 12px; }
  .bubble.bot { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 12px 12px 12px 4px; }
  .bubble.err { background: var(--err-bg); color: var(--err-ink); border-color: transparent; }
  .act { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); align-items: start; }
  .act time { font: 500 13px "IBM Plex Mono", monospace; color: var(--faint); padding-top: 2px; }
  .act span.t { overflow-wrap: anywhere; font-size: 15px; }
  .who-row { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
  .who-row span { font-size: 14px; color: var(--muted); }
  .empty { color: var(--faint); font-size: 14px; padding: 6px 0; }
  @media (max-width: 600px) { .act { grid-template-columns: 56px minmax(0, 1fr); } .act .pill { grid-column: 2; justify-self: start; } }
  header select { min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #4A5190;
    background: #2A2F57; color: #fff; font: inherit; font-size: 15px; max-width: 260px; }
  header .gicon { width: 28px; height: 28px; border-radius: 50%; flex: none; background: #4A5190; }
  .checks { display: flex; flex-direction: column; gap: 2px; max-height: 190px; overflow-y: auto;
    border: 1px solid #C9CDD9; border-radius: 10px; padding: 6px 8px; background: #fff; }
  .checks label { flex-direction: row; align-items: center; gap: 8px; font-weight: 400; font-size: 15px;
    min-height: 32px; }
  .checks input { width: 18px; height: 18px; flex: none; }
  select.field { min-height: 44px; padding: 0 12px; border: 1px solid #C9CDD9; border-radius: 10px;
    font: inherit; font-size: 15px; width: 100%; background: #fff; }
  .notice.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .empty-state { align-items: flex-start; gap: 18px; }
  .btn.big { min-height: 56px; padding: 0 32px; font-size: 18px; border-radius: 14px; }
  .steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; }
  .langsw { display: inline-flex; border: 1px solid #4A5190; border-radius: 8px; overflow: hidden; }
  header .langsw button, .langsw button { background: none; border: 0; color: #C5CAE8; font-size: 13px; font-weight: 600;
    padding: 5px 10px; text-decoration: none; min-height: 32px; }
  .langsw button[aria-pressed="true"] { background: #5865F2; color: #fff; }
  #login .pitch .grow { flex: 1 1 auto; }
</style>
</head>
<body>

<div id="login" hidden>
  <section class="pitch">
    <div style="display:flex;align-items:center;gap:12px"><span class="mark" aria-hidden="true" data-i18n="mark"></span><strong style="font-size:22px" data-i18n="brand_name"></strong><div class="grow"></div><div class="langsw" role="group" data-i18n-attr="aria-label:lang_switch_aria"><button type="button" data-lang="th">TH</button><button type="button" data-lang="en">EN</button></div></div>
    <h1 data-i18n="login_h1"></h1>
    <p data-i18n="login_p"></p>
    <ul>
      <li><span>01</span><span class="li-t" data-i18n="login_li1"></span></li>
      <li><span>02</span><span class="li-t" data-i18n="login_li2"></span></li>
      <li><span>03</span><span class="li-t" data-i18n="login_li3"></span></li>
    </ul>
  </section>
  <section class="panel">
    <div class="box">
      <h2 data-i18n="login_h2"></h2>
      <p data-i18n="login_p2"></p>
      <div id="gsi-button"></div>
      <div class="notice error" id="login-msg" role="alert" hidden></div>
      <div class="notice" id="not-configured" data-i18n="not_configured" hidden></div>
      <p style="font-size:13px;color:var(--faint)" data-i18n-html="login_p3"></p>
      <a href="/" style="font-size:14px" data-i18n="back_recorder"></a>
    </div>
  </section>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true" data-i18n="mark"></span><strong data-i18n="brand_name"></strong><span data-i18n="brand_sub"></span></div>
    <div class="grow"></div>
    <img class="gicon" id="gicon" alt="" hidden>
    <select id="guild-switch" data-i18n-attr="aria-label:guild_switch_aria" hidden></select>
    <span class="who" id="who"></span>
    <div class="langsw" role="group" data-i18n-attr="aria-label:lang_switch_aria"><button type="button" data-lang="th">TH</button><button type="button" data-lang="en">EN</button></div>
    <button type="button" id="signout" data-i18n="signout"></button>
  </header>
  <div class="layout">
    <nav data-i18n-attr="aria-label:nav_aria">
      <a href="#channels" data-i18n="nav_overview"></a>
      <a href="#channels" data-i18n="nav_channels"></a>
      <a href="#hidden-channels" data-i18n="nav_hidden"></a>
      <a href="#skills" data-i18n="nav_skills"></a>
      <a href="#command" data-i18n="nav_command"></a>
      <a href="#activity" data-i18n="nav_activity"></a>
      <a href="#people" data-i18n="nav_people"></a>
    </nav>
    <main>
      <h1 data-i18n="hello"></h1>
      <div class="notice error" id="app-msg" role="alert" hidden></div>
      <div class="notice" id="link-msg" role="status" hidden></div>

      <section class="card empty-state" id="no-guild" aria-labelledby="ng-h" hidden>
        <h2 id="ng-h" data-i18n="ng_h"></h2>
        <a class="btn big discord" id="invite-big" href="#" target="_blank" rel="noopener" data-i18n="invite_big" hidden></a>
        <p id="invite-big-soon" class="hint" data-i18n="discord_not_set" hidden></p>
        <ol class="steps">
          <li data-i18n="ng_step1"></li>
          <li data-i18n-html="ng_step2"></li>
        </ol>
        <span class="hint" data-i18n="ng_hint"></span>
      </section>

      <div id="guild-view" hidden>

      <section class="card" id="channels" aria-labelledby="ch-h">
        <h2 id="ch-h" data-i18n="ch_h"></h2>
        <div class="channels">
          <div class="ch">
            <div class="top"><strong>Discord</strong><span class="pill ok" id="guild-pill" data-i18n="ready"></span></div>
            <p id="guild-name" data-i18n="guild_name_default"></p>
            <a class="btn discord" id="invite" href="#" target="_blank" rel="noopener" data-i18n="invite_other" hidden></a>
            <p id="invite-soon" data-i18n="discord_not_set" hidden></p>
          </div>
          <div class="ch">
            <div class="top"><strong>Google Meet</strong><span class="pill ok" data-i18n="ready"></span></div>
            <p data-i18n="meet_p"></p>
            <a href="/" style="font-weight:600" data-i18n="meet_start"></a>
          </div>
          <div class="ch soon">
            <div class="top"><strong>LINE</strong><span class="pill" data-i18n="soon"></span></div>
            <p data-i18n="line_p"></p>
          </div>
        </div>
      </section>

      <section class="card" id="hidden-channels" aria-labelledby="hc-h">
        <h2 id="hc-h"><span data-i18n="hc_h"></span> <span class="pill warn" id="hc-count" hidden></span></h2>
        <div id="hc-list"><div class="empty" data-i18n="loading"></div></div>
        <div id="hc-help" hidden>
          <strong data-i18n="hc_how"></strong>
          <ol class="steps">
            <li data-i18n="hc_s1"></li>
            <li data-i18n="hc_s2"></li>
            <li data-i18n="hc_s3"></li>
            <li data-i18n="hc_s4"></li>
          </ol>
          <span class="hint" data-i18n="hc_hint1"></span>
        </div>
        <span class="hint" data-i18n="hc_hint2"></span>
      </section>

      <section class="card" id="skills" aria-labelledby="sk-h">
        <h2 id="sk-h" data-i18n="sk_h"></h2>
        <div id="features"></div>
        <div class="fields">
          <label><span data-i18n="receipt_ids_l"></span> <div class="checks" id="receipt-ids"></div><small data-i18n="receipt_ids_s"></small></label>
          <label><span data-i18n="home_id_l"></span> <select class="field" id="receipt-home"></select><small data-i18n="home_id_s"></small></label>
          <div class="checks"><label><input type="checkbox" id="receipt-forward"> <span data-i18n="fwd_l"></span></label></div><small data-i18n="fwd_s"></small>
          <label><span data-i18n="ask_ids_l"></span> <div class="checks" id="ask-ids"></div><small data-i18n="ask_ids_s"></small></label>
          <label><span data-i18n="digest_id_l"></span> <select class="field" id="digest-id"></select></label>
          <label><span data-i18n="mem_days_l"></span>
            <select id="mem-days"><option value="7" data-i18n="days_n" data-n="7"></option><option value="30" data-i18n="days_n" data-n="30"></option><option value="90" data-i18n="days_n" data-n="90"></option><option value="180" data-i18n="days_n" data-n="180"></option><option value="365" data-i18n="days_n" data-n="365"></option><option value="custom" data-i18n="custom"></option></select>
            <input type="number" id="mem-days-custom" min="1" max="3650" step="1" hidden>
            <small data-i18n="mem_days_s"></small>
            <small id="mem-progress"></small></label>
          <label><span data-i18n="digest_time_l"></span> <input type="time" id="digest-time" value="18:00"><small data-i18n="digest_time_s"></small></label>
          <label><span data-i18n="followup_time_l"></span> <input type="time" id="followup-time" value="10:00"><small data-i18n="digest_time_s"></small></label>
          <label><span data-i18n="morning_time_l"></span> <input type="time" id="morning-time" value="08:30"><small data-i18n="digest_time_s"></small></label>
          <label><span data-i18n="evening_time_l"></span> <input type="time" id="evening-time" value="18:00"><small data-i18n="digest_time_s"></small></label>
          <label><span data-i18n="report_time_l"></span> <input type="time" id="report-time" value="18:30"><small data-i18n="digest_time_s"></small></label>
          <label><span data-i18n="report_id_l"></span> <select class="field" id="report-id"></select><small data-i18n="report_id_s"></small></label>
          <label><span data-i18n="exec_roles_l"></span> <input type="text" id="exec-roles" data-i18n-attr="placeholder:exec_roles_ph"><small data-i18n="exec_roles_s"></small></label>
        </div>
        <h3 id="modes-h" style="margin:18px 0 6px;font-size:1rem" data-i18n="modes_h"></h3>
        <div class="fields" id="modes">
          <label><span data-i18n="default_mode_l"></span> <select class="field" id="default-mode"></select><small data-i18n="default_mode_s"></small></label>
          <label><span data-i18n="default_lang_l"></span> <select class="field" id="default-language"></select><small data-i18n="default_lang_s"></small></label>
          <label><span data-i18n="default_tone_l"></span> <select class="field" id="default-tone"></select><small data-i18n="default_tone_s"></small></label>
          <label><span data-i18n="tone_note_l"></span> <input type="text" id="tone-note" maxlength="200" data-i18n-attr="placeholder:tone_note_ph"><small data-i18n="tone_note_s"></small></label>
          <label><input type="checkbox" id="personal-settings" checked> <span data-i18n="personal_l"></span><small data-i18n="personal_s"></small></label>
          <label><span data-i18n="langmode_l"></span> <select class="field" id="language-mode"><option value="audience" data-i18n="langmode_audience"></option><option value="company_only" data-i18n="langmode_only"></option></select><small data-i18n="langmode_s"></small></label>
 },
          <label><input type="checkbox" id="captions-default"> <span data-i18n="captions_default_l"></span><small data-i18n="captions_default_s"></small></label>
          <fieldset id="task-mode" style="border:0;padding:0;margin:0 0 8px">
            <legend data-i18n="task_mode_l"></legend>
            <label><input type="radio" name="task-confirm" value="notify" checked> <span data-i18n="task_mode_notify_l"></span><small data-i18n="task_mode_notify_s"></small></label>
            <label><input type="radio" name="task-confirm" value="approve"> <span data-i18n="task_mode_approve_l"></span><small data-i18n="task_mode_approve_s"></small></label>
          </fieldset>
          <div id="channel-modes" class="fields"></div>
        </div>
        <small class="hint" data-i18n="modes_hint"></small>
        <span class="hint" id="no-channels" data-i18n="no_channels" hidden></span>
        <div class="row">
          <button type="button" class="btn" id="save" data-i18n="save"></button>
          <span class="hint" id="save-msg" role="status" aria-live="polite"></span>
        </div>
        <span class="hint" data-i18n="save_hint"></span>
      </section>

      <section class="card" id="command" aria-labelledby="cm-h">
        <h2 id="cm-h" data-i18n="cm_h"></h2>
        <div class="chat" id="chat" aria-live="polite"><div class="empty" id="chat-empty" data-i18n="chat_empty"></div></div>
        <form class="row" id="ask-form">
          <label for="ask" style="position:absolute;width:1px;height:1px;overflow:hidden" data-i18n="ask_label"></label>
          <input type="text" id="ask" maxlength="1000" data-i18n-attr="placeholder:ask_ph" style="flex:1 1 280px;width:auto" autocomplete="off">
          <button type="submit" class="btn" id="ask-btn" data-i18n="send"></button>
        </form>
        <span class="hint" data-i18n="ask_hint"></span>
      </section>

      <div class="cols">
        <section class="card" id="activity" aria-labelledby="ac-h">
          <h2 id="ac-h" data-i18n="ac_h"></h2>
          <div id="activity-list"><div class="empty" data-i18n="loading"></div></div>
        </section>
        <section class="card" id="people" aria-labelledby="pp-h">
          <h2 id="pp-h" data-i18n="pp_h"></h2>
          <div class="who-row"><strong data-i18n="pp1_t"></strong><span data-i18n="pp1_d"></span></div>
          <div class="who-row"><strong data-i18n="pp2_t"></strong><span data-i18n="pp2_d"></span></div>
          <div class="who-row"><strong data-i18n="pp3_t"></strong><span data-i18n="pp3_d"></span></div>
          <div class="who-row"><strong data-i18n="pp4_t"></strong><span data-i18n="pp4_d"></span></div>
        </section>
      </div>
      </div>
    </main>
  </div>
</div>

<script type="application/json" id="i18n-data">{
 "title": {
  "th": "สลิด ศูนย์บัญชาการ",
  "en": "Salid Command Center"
 },
 "mark": {
  "th": "ส",
  "en": "S"
 },
 "brand_name": {
  "th": "สลิด",
  "en": "Salid"
 },
 "brand_sub": {
  "th": "ศูนย์บัญชาการ",
  "en": "Command center"

// Browser storage may be blocked: every access is wrapped, and the page works without it.
function mem(op, key, v) {
  try {
    if (op === "get") return sessionStorage.getItem(key);
    if (op === "set") sessionStorage.setItem(key, v);
    else sessionStorage.removeItem(key);
  } catch { /* storage blocked: values then live only in memory */ }
  return null;
}

// A `/ตั้งค่า` link opens /hub?link=<code>. Take the code out of the address bar at once (it is a
// one-time credential) and keep it until it has been redeemed after sign-in.
let linkCode = null;
try {
  const params = new URLSearchParams(location.search);
  if (params.has("link")) {
    linkCode = params.get("link");
    mem("set", LINK_KEY, linkCode);
    history.replaceState(null, "", location.pathname);
  }
} catch { /* ignore */ }

class AuthError extends Error {}
class ApiError extends Error { constructor(detail, status) { super(detail); this.status = status; } }
// Localized text of an API failure; the server's detail (neutral English) is appended in brackets.
const errText = (e) => (e instanceof ApiError ? t("err_generic", { status: e.status }) + (e.message ? " [" + e.message + "]" : "") : String(e.message));
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { ...(opts.body ? { "Content-Type": "application/json" } : {}), Authorization: "Bearer " + token },
  });
  if (res.status === 401) throw new AuthError("expired");
  if (res.status === 503) throw new AuthError("not_configured");
  if (res.status === 403) throw new AuthError("forbidden");
  if (!res.ok) {
    let detail = "";
    try { const j = await res.json(); detail = typeof j.detail === "string" ? j.detail : ""; } catch { /* ignore */ }
    throw new ApiError(detail, res.status);
  }
  return res.json();
}

// Returns true when `e` was an auth problem and has been handled. A 403 on a guild call only
// means "not your guild" (the account itself is fine), so it does not sign the user out.
function handleAuth(e, { guildCall = false } = {}) {
  if (!(e instanceof AuthError)) return false;
  if (e.message === "not_configured") { token = null; show("login"); $("not-configured").hidden = false; $("gsi-button").hidden = true; }
  else if (e.message === "forbidden" && guildCall) note($("app-msg"), () => t("err_forbidden_guild"));
  else if (e.message === "forbidden") toLogin(() => t("err_forbidden"));
  else toLogin(() => t("err_expired"));
  return true;
}

function fmtTime(iso) {
  const d = new Date(iso);
  const sameDay = d.toDateString() === new Date().toDateString();
  return sameDay ? d.toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit", hour12: false })
    : d.toLocaleDateString(locale(), { day: "numeric", month: "short" });
}
// Money in the receipt's own currency (a missing currency counts as THB); never mixes currencies.
function fmtMoney(amount, cur) {
  const c = (cur || "THB").toUpperCase();
  const n = Math.abs(amount).toLocaleString(locale(), { maximumFractionDigits: 2 });
  const sign = amount < 0 ? "-" : "";
  if (c === "THB") return sign + "฿" + n;
  if (c === "USD") return sign + "$" + n;
  return sign + n + " " + c;
}

// Redeem the one-time `/ตั้งค่า` code with the signed-in Google account. Returns the guild id
// on success. An auth error keeps the code for after the next sign-in; any other outcome
// consumes it, since a code is useless once it has been tried.
async function redeemLink() {
  const code = linkCode;
  try {
    const g = await api("/api/hub/link", { method: "POST", body: JSON.stringify({ code }) });
    linkCode = null; mem("clear", LINK_KEY);
    $("link-msg").className = "notice ok";
    note($("link-msg"), () => t("link_ok", { name: g.name }));
    return g.id;
  } catch (e) {
    if (e instanceof AuthError) throw e;
    linkCode = null; mem("clear", LINK_KEY);
    $("link-msg").className = "notice error";
    note($("link-msg"), () => t("link_bad"));
    return null;
  }
}

async function start() {
  try {
    const me = await api("/api/hub/me");
    note($("login-msg"), "");
    $("who").textContent = me.email;
    for (const [btn, soon] of [["invite", "invite-soon"], ["invite-big", "invite-big-soon"]]) {
      $(btn).hidden = !me.invite_url; $(soon).hidden = !!me.invite_url;
      if (me.invite_url) $(btn).href = me.invite_url;
    }
    show("app");
    const linked = linkCode ? await redeemLink() : null;
    guilds = await api("/api/hub/guilds");
    const wanted = linked || mem("get", GUILD_KEY);
    guildId = (guilds.find((g) => g.id === wanted) || guilds[0] || {}).id || null;
    renderSwitcher();
    if (!guildId) { $("guild-view").hidden = true; $("no-guild").hidden = false; return; }
    await loadGuild(guildId);
  } catch (e) {
    if (!handleAuth(e)) { show("app"); note($("app-msg"), () => t("err_load", { err: errText(e) })); }
  }
}

$("save").addEventListener("click", save);
$("mem-days").addEventListener("change", (ev) => { $("mem-days-custom").hidden = ev.target.value !== "custom"; });
$("ask-form").addEventListener("submit", ask);
$("guild-switch").addEventListener("change", (ev) => loadGuild(ev.target.value));
$("signout").addEventListener("click", () => {
  try { if (window.google && google.accounts) google.accounts.id.disableAutoSelect(); } catch { /* ignore */ }
  toLogin("");
});
applyStatic();
renderFeatures();
if (token && CLIENT_ID) start(); else toLogin("");
</script>
</body>
</html>
