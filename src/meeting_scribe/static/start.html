<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your Salid account</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #FAF9F6; --bg-2: #F3F1EC; --ink: #1B1F3B; --muted: #5B6078; --faint: #8A8FA6; --line: #E6E3DC;
    --indigo: #2B2F7A; --indigo-2: #4A4FBF; --lavender: #B9B4F2; --gold: #D9C28A;
    --ok-bg: #DDF3E8; --ok-ink: #0B6B45; --warn-bg: #FFF1D6; --warn-ink: #8A5A00; --err-bg: #FDE7E4; --err-ink: #A12315;
    --shadow: 0 10px 30px rgba(43,47,122,.08), 0 1px 2px rgba(43,47,122,.06); --ease: cubic-bezier(.22,.8,.3,1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased;
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", "Segoe UI", Tahoma, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  a { color: var(--indigo-2); } [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; } button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--indigo-2); outline-offset: 3px; border-radius: 8px; }
  .nav { border-bottom: 1px solid var(--line); background: rgba(250,249,246,.9); }
  .nav .wrap { display: flex; align-items: center; gap: 16px; min-height: 64px; }
  .wrap { width: min(880px, 100% - 32px); margin: 0 auto; }
  .logo { display: flex; align-items: center; gap: 10px; color: var(--indigo); text-decoration: none; font-weight: 700; font-size: 18px; }
  .logo .mark { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-size: 15px;
    background: linear-gradient(135deg, var(--indigo-2), #7A6CF0); box-shadow: 0 4px 12px rgba(74,79,191,.3); }
  .grow { flex: 1 1 auto; }
  .langsw { display: flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; background: #fff; }
  .langsw button { border: 0; background: none; padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .langsw button[aria-pressed="true"] { background: var(--indigo); color: #fff; }
  .who { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  main { flex: 1; padding: 40px 0 64px; }
  .steps { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
  .steps span { flex: 1 1 120px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--faint); padding: 8px 0; border-top: 3px solid var(--line); }
  .steps span i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--line); color: var(--muted); }
  .steps span.on { color: var(--indigo); border-top-color: var(--indigo-2); } .steps span.on i { background: var(--indigo-2); color: #fff; }
  .steps span.done { color: var(--ok-ink); border-top-color: var(--ok-ink); } .steps span.done i { background: var(--ok-ink); color: #fff; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 32px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 18px; }
  .card h1 { font-size: clamp(26px, 4vw, 34px); line-height: 1.2; letter-spacing: -.01em; }
  .card h2 { font-size: 22px; line-height: 1.25; }
  .card p { color: var(--muted); font-size: 16px; }
  .eyebrow { font-size: 13px; letter-spacing: .18em; font-weight: 600; color: var(--indigo-2); }
  ul.gets { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  ul.gets li { display: flex; gap: 12px; align-items: flex-start; font-size: 15.5px; }
  ul.gets svg { width: 20px; height: 20px; flex: none; color: var(--indigo-2); margin-top: 3px; }
  ul.gets b { font-weight: 600; } ul.gets span { color: var(--muted); }
  #gsi-button { min-height: 44px; display: flex; }
  .notice { padding: 10px 14px; border-radius: 10px; font-size: 14px; background: var(--warn-bg); color: var(--warn-ink); }
  .notice.error { background: var(--err-bg); color: var(--err-ink); } .notice.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .plan { border: 2px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; background: #fff; text-align: left; }
  .plan[aria-pressed="true"] { border-color: var(--indigo-2); background: #F7F7FF; }
  .plan b { font-size: 16px; } .plan .price { font-size: 14px; color: var(--indigo); font-weight: 600; } .plan span { font-size: 13px; color: var(--muted); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #EEF0FF; color: var(--indigo); font-weight: 500; align-self: flex-start; }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px; }
  input[type=text] { font: inherit; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 12px; font-weight: 600; font-size: 15px;
    text-decoration: none; border: 1px solid transparent; transition: transform .15s var(--ease), box-shadow .15s var(--ease); }
  .btn.primary { background: var(--indigo); color: #fff; box-shadow: 0 6px 18px rgba(43,47,122,.25); }
  .btn.primary:hover { background: #22265F; transform: translateY(-1px); }
  .btn.primary:disabled, .btn.primary[aria-disabled="true"] { background: #C9CBE0; box-shadow: none; cursor: not-allowed; pointer-events: none; }
  .btn.ghost { color: var(--indigo); border-color: var(--line); background: #fff; }
  .btn.ghost:hover { border-color: var(--lavender); }
  ol.how { margin: 0; padding-left: 22px; display: grid; gap: 8px; color: var(--muted); font-size: 15px; }
  ol.how code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; background: #EEF0FF; color: var(--indigo); padding: 2px 7px; border-radius: 6px; }
  footer { border-top: 1px solid var(--line); padding: 20px 0 32px; color: var(--faint); font-size: 13.5px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  footer a { color: var(--muted); text-decoration: none; }
  @media (max-width: 560px) { .card { padding: 22px 18px; } }
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="logo" href="/" aria-label="Salid"><span class="mark" aria-hidden="true">S</span><span data-i18n="brand"></span></a>
    <div class="grow"></div>
    <span class="who" id="who" hidden></span>
    <div class="langsw" role="group" data-i18n-attr="aria-label:lang_switch_aria">
      <button type="button" data-lang="th" data-i18n="lang_th"></button>
      <button type="button" data-lang="en" data-i18n="lang_en"></button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="steps" aria-hidden="true">
      <span data-step="1" class="on"><i>1</i><em data-i18n="s1"></em></span>
      <span data-step="2"><i>2</i><em data-i18n="s2"></em></span>
      <span data-step="3"><i>3</i><em data-i18n="s3"></em></span>
      <span data-step="4"><i>4</i><em data-i18n="s4"></em></span>
    </div>

    <!-- step 1: welcome + Google sign-in -->
    <section class="card" id="step1">
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="w_h"></h1>
      <p data-i18n="w_p"></p>
      <ul class="gets">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><div><b data-i18n="g1_t"></b> <span data-i18n="g1_d"></span></div></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><div><b data-i18n="g2_t"></b> <span data-i18n="g2_d"></span></div></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><div><b data-i18n="g3_t"></b> <span data-i18n="g3_d"></span></div></li>
      </ul>
      <p data-i18n="w_next"></p>
      <div id="gsi-button"></div>
      <div class="notice" id="not-configured" data-i18n="not_configured" hidden></div>
      <div class="notice error" id="login-error" hidden></div>
      <p style="font-size:13px;color:var(--faint)" data-i18n="w_privacy"></p>
    </section>

    <!-- already a member -->
    <section class="card" id="existing" hidden>
      <h2 data-i18n="ex_h"></h2>
      <p data-i18n="ex_p"></p>
      <div class="row"><a class="btn primary" href="/center" data-i18n="go_center"></a><button type="button" class="btn ghost" id="another" data-i18n="ex_new"></button></div>
    </section>

    <!-- step 2: plan -->
    <section class="card" id="step2" hidden>
      <h2 data-i18n="p_h"></h2>
      <p data-i18n="p_p"></p>
      <div class="plans" role="group" data-i18n-attr="aria-label:p_h">
        <button type="button" class="plan" data-plan="trial" aria-pressed="true"><span class="pill" data-i18n="p_rec"></span><b data-i18n="pl_trial"></b><span class="price" data-i18n="pl_trial_price"></span><span data-i18n="pl_trial_d"></span></button>
      </div>
      <div class="notice" data-i18n="p_note"></div>
      <div class="row"><button type="button" class="btn primary" id="to3" data-i18n="next"></button></div>
    </section>

    <!-- step 3: organization -->
    <section class="card" id="step3" hidden>
      <h2 data-i18n="o_h"></h2>
      <p data-i18n="o_p"></p>
      <label><span data-i18n="o_label"></span><input type="text" id="org-name" maxlength="120" autocomplete="organization" data-i18n-attr="placeholder:o_ph"></label>
      <div class="notice error" id="org-error" hidden></div>
      <div class="row"><button type="button" class="btn primary" id="create" data-i18n="o_btn"></button><button type="button" class="btn ghost" id="back2" data-i18n="back"></button></div>
    </section>

    <!-- step 4: connect Discord -->
    <section class="card" id="step4" hidden>
      <div class="notice ok" id="created-note"></div>
      <h2 data-i18n="c_h"></h2>
      <p data-i18n="c_p"></p>
      <ol class="how">
        <li data-i18n-html="c1"></li>
        <li data-i18n-html="c2"></li>
        <li data-i18n-html="c3"></li>
      </ol>
      <div class="row">
        <a class="btn primary" href="__SALID_INVITE_URL__" data-invite></a>
        <a class="btn ghost" href="/center" data-i18n="go_center"></a>
      </div>
      <p style="font-size:13px;color:var(--faint)" data-i18n="c_later"></p>
    </section>
  </div>
</main>

<footer>
  <div class="wrap"><span data-i18n="foot_copy"></span><a href="/" data-i18n="foot_home"></a><a href="/center" data-i18n="go_center"></a></div>
</footer>

<script>
// ---------- language: shared key with the landing page ----------
const LANG_KEY = "salid-language", SUPPORTED = ["th", "en"];
const $ = (id) => document.getElementById(id);
const I18N = JSON.parse($("i18n-data").textContent);
function readLang(op, v) {
  try {
    if (op === "set") { localStorage.setItem(LANG_KEY, v); return null; }
    const s = localStorage.getItem(LANG_KEY); return SUPPORTED.includes(s) ? s : null;
  } catch { return null; }
}
function browserLang() {
  const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
  for (const l of list) { const p = String(l).toLowerCase().split("-")[0]; if (SUPPORTED.includes(p)) return p; }
  return "en";
}
let lang = readLang("get") || browserLang();
function t(key, params) {
  const e = I18N[key]; let s = e ? (e[lang] ?? e.en) : key;
  if (params) for (const [k, v] of Object.entries(params)) s = s.split("{" + k + "}").join(String(v));
  return s;
}
function applyStatic() {
  document.documentElement.lang = lang; document.title = t("title");
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n, el._p);
  for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll("[data-i18n-attr]")) for (const pair of el.dataset.i18nAttr.split(";")) { const [a, k] = pair.split(":"); el.setAttribute(a, t(k)); }
  for (const el of document.querySelectorAll("[data-lang]")) el.setAttribute("aria-pressed", String(el.dataset.lang === lang));
  for (const el of document.querySelectorAll(".notice")) if (el._f) el.textContent = el._f();
  markInvite();
  if (!$("step1").hidden) renderGoogleButton();
}
function setLang(l) { if (!SUPPORTED.includes(l)) return; lang = l; readLang("set", l); applyStatic(); }
for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => setLang(b.dataset.lang));
function note(el, fn) { el._f = fn; el.textContent = fn ? fn() : ""; el.hidden = !el.textContent; }
function markInvite() {
  for (const a of document.querySelectorAll("[data-invite]")) {
    const ok = a.getAttribute("href").startsWith("https://discord.com/");
    a.setAttribute("aria-disabled", String(!ok));
    if (ok) { a.target = "_blank"; a.rel = "noopener"; a.textContent = t("cta_add"); } else { a.removeAttribute("target"); a.textContent = t("cta_unconfigured"); }
  }
}

// ---------- flow ----------
const CLIENT_ID = "__HUB_GOOGLE_CLIENT_ID__";
const API = "/api/center";
let token = "", gsiReady = false, me = null;
function show(step) {
  for (const id of ["step1", "existing", "step2", "step3", "step4"]) $(id).hidden = id !== step;
  const n = { step1: 1, existing: 1, step2: 2, step3: 3, step4: 4 }[step];
  for (const s of document.querySelectorAll("[data-step]")) {
    const k = Number(s.dataset.step); s.classList.toggle("on", k === n); s.classList.toggle("done", k < n);
  }
  window.scrollTo({ top: 0 });
}
async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { ...(opts.body ? { "Content-Type": "application/json" } : {}), Authorization: "Bearer " + token } });
  if (!res.ok) { const err = new Error("api"); err.status = res.status; throw err; }
  return res.json();
}
function renderGoogleButton() {
  if (!CLIENT_ID) { $("not-configured").hidden = false; return; }
  if (!window.google || !google.accounts) { setTimeout(renderGoogleButton, 200); return; }
  if (!gsiReady) { google.accounts.id.initialize({ client_id: CLIENT_ID, callback: (r) => { token = r.credential; signedIn(); } }); gsiReady = true; }
  $("gsi-button").replaceChildren();
  google.accounts.id.renderButton($("gsi-button"), { theme: "outline", size: "large", text: "signup_with", locale: lang, width: 300 });
}
async function signedIn() {
  try { me = await api("/me"); }
  catch (e) { note($("login-error"), () => t("login_failed", { status: e.status || "network" })); token = ""; return; }
  $("who").textContent = me.email; $("who").hidden = false;
  show(me.orgs.length ? "existing" : "step2");
}
$("another").addEventListener("click", () => show("step2"));
$("to3").addEventListener("click", () => { show("step3"); $("org-name").focus(); });
$("back2").addEventListener("click", () => show("step2"));
$("create").addEventListener("click", async () => {
  const name = $("org-name").value.trim();
  if (!name) { note($("org-error"), () => t("o_empty")); return; }
  $("create").disabled = true; note($("org-error"), null);
  try {
    // Launch: the only plan is the open-ended trial (POST /orgs grants it); nothing is charged.
    const org = await api("/orgs", { method: "POST", body: JSON.stringify({ name }) });
    note($("created-note"), () => t("created", { name, plan: t("pl_" + (org.license && org.license.plan || "trial")) }));
    show("step4");
  } catch (e) {
    note($("org-error"), () => t(e.status === 409 ? "o_too_many" : "o_failed", { status: e.status || "network" }));
  } finally { $("create").disabled = false; }
});
$("org-name").addEventListener("keydown", (e) => { if (e.key === "Enter") $("create").click(); });
applyStatic();
</script>
