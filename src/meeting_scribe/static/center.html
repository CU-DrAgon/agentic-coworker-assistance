<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salid Command Center</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --bg:#F3F4F7; --card:#fff; --ink:#171A21; --muted:#545B6E; --faint:#6A7183;
  --line:#DCDFE8; --line-soft:#ECEEF3; --navy:#1D2140; --accent:#4752C4; --link:#3F49B8;
  --on-accent:#fff; --nav-active:#E3E5F6;
  --ok-bg:#DDF3E8; --ok-ink:#0B6B45; --warn-bg:#FFF1D6; --warn-ink:#8A5A00;
  --err-bg:#FDE7E4; --err-ink:#A12315; --soon-bg:#ECEEF3; --chip:#EEF0FB;
  --bubble-me:#4752C4; --bubble-bot:#EEF0FB; --shadow:0 8px 30px rgba(20,24,50,.18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#10121A; --card:#181B27; --ink:#E9EBF5; --muted:#A5ACC4; --faint:#8E96B0;
    --line:#2C3045; --line-soft:#232739; --navy:#0B0D16; --accent:#7C87F0; --link:#9CA6FF;
    --on-accent:#10121A; --nav-active:#252A47;
    --ok-bg:#12382A; --ok-ink:#7AE0B0; --warn-bg:#40300D; --warn-ink:#F3C969;
    --err-bg:#46201B; --err-ink:#FFA99B; --soon-bg:#232739; --chip:#232A4A;
    --bubble-me:#5F6BE0; --bubble-bot:#232739; --shadow:0 8px 30px rgba(0,0,0,.5);
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); line-height:1.55; overflow-x:hidden;
  font-family:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif; }
a { color:var(--link); }
[hidden] { display:none !important; }
h1,h2,h3,p { margin:0; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.mono { font-family:"IBM Plex Mono",monospace; }
.mark { width:36px; height:36px; border-radius:10px; background:#5865F2; color:#fff; display:grid; place-items:center; font-weight:700; font-size:18px; flex:none; }

/* buttons & fields */
.btn { background:var(--accent); color:var(--on-accent); border:1px solid var(--accent); border-radius:9px; padding:8px 16px; font-weight:600; min-height:40px; }
.btn.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
.btn.danger { background:transparent; color:var(--err-ink); border-color:var(--err-ink); }
.btn.sm { min-height:32px; padding:4px 12px; font-size:14px; }
.btn[disabled] { opacity:.55; cursor:not-allowed; }
label.f { display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--muted); min-width:0; }
input[type=text],input[type=email],input[type=search],input[type=date],input[type=number],input[type=url],select,textarea {
  background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 12px; min-height:40px; width:100%; color:var(--ink); }
textarea { resize:vertical; min-height:80px; }
.row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
.row > * { flex:1 1 160px; min-width:0; }
.row > .btn { flex:0 0 auto; }
.notice { padding:10px 14px; border-radius:10px; font-size:14px; background:var(--warn-bg); color:var(--warn-ink); }
.notice.error { background:var(--err-bg); color:var(--err-ink); }
.notice.ok { background:var(--ok-bg); color:var(--ok-ink); }
.badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:13px; font-weight:600; background:var(--soon-bg); color:var(--muted); }
.badge.ok { background:var(--ok-bg); color:var(--ok-ink); } .badge.warn { background:var(--warn-bg); color:var(--warn-ink); } .badge.err { background:var(--err-bg); color:var(--err-ink); }
.chip { display:inline-block; padding:2px 10px; border-radius:8px; background:var(--chip); font-size:13px; }
.muted { color:var(--muted); } .small { font-size:14px; }

/* login */
#login { min-height:100vh; display:flex; flex-wrap:wrap; }
#login .pitch { flex:1 1 420px; background:var(--navy); color:#EEF0FA; padding:48px 20px; display:flex; flex-direction:column; gap:22px; }
#login .pitch h1 { font-size:32px; line-height:1.3; max-width:520px; }
#login .pitch p { font-size:17px; color:#C5CAE8; max-width:500px; }
#login .pitch ul { margin:0; padding:0; display:flex; flex-direction:column; gap:10px; list-style:none; }
#login .pitch li { color:#DDE0F5; }
#login .panel { flex:1 1 360px; display:grid; place-items:center; padding:40px 16px; }
#login .box { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 22px; display:flex; flex-direction:column; gap:14px; }
#gsi-button { min-height:44px; display:flex; justify-content:center; }

/* shell */
#app { min-height:100vh; display:flex; }
#side { width:250px; flex:none; background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:10px; padding:14px 12px; position:sticky; top:0; height:100vh; overflow-y:auto; }
.brand { display:flex; align-items:center; gap:10px; padding:2px 4px; } .brand strong { font-size:18px; }
#side nav { display:flex; flex-direction:column; gap:2px; }
#side nav a { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:var(--ink); text-decoration:none; }
#side nav a:hover { background:var(--line-soft); }
#side nav a[aria-current=page] { background:var(--nav-active); font-weight:600; }
#side .foot { margin-top:auto; display:flex; flex-direction:column; gap:8px; font-size:14px; }
#side .who { overflow-wrap:anywhere; color:var(--muted); }
#topbar { display:none; }
#content { flex:1 1 auto; min-width:0; padding:22px 24px 40px; max-width:1200px; margin:0 auto; width:100%; }
#content > h1 { font-size:26px; margin-bottom:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:12px; min-width:0; margin-bottom:16px; }
.card h2 { font-size:18px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
.grid > .card { margin-bottom:0; }
.stat { font-size:30px; font-weight:700; line-height:1.2; }
.kv { display:flex; justify-content:space-between; gap:10px; font-size:15px; border-bottom:1px solid var(--line-soft); padding:4px 0; }
.empty { text-align:center; color:var(--muted); padding:28px 12px; border:1px dashed var(--line); border-radius:12px; }
.skeleton { height:18px; border-radius:6px; background:linear-gradient(90deg,var(--line-soft),var(--line),var(--line-soft)); background-size:200% 100%; animation:sk 1.2s linear infinite; }
@keyframes sk { to { background-position:-200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation:none; } }
ol.steps { margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:10px; counter-reset:s; }
ol.steps li { display:flex; gap:12px; align-items:flex-start; counter-increment:s; }
ol.steps li::before { content:counter(s); width:28px; height:28px; border-radius:50%; background:var(--chip); color:var(--accent); display:grid; place-items:center; font-weight:700; flex:none; }
ol.steps li.done::before { content:"✓"; background:var(--ok-bg); color:var(--ok-ink); }

/* tabs & tables */
.tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
.tabs button { background:transparent; border:1px solid var(--line); border-radius:99px; padding:6px 14px; white-space:nowrap; min-height:36px; }
.tabs button[aria-selected=true] { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
.tbl { width:100%; border-collapse:collapse; font-size:15px; }
.tbl th { text-align:left; color:var(--muted); font-weight:500; font-size:13px; padding:6px 8px; border-bottom:1px solid var(--line); }
.tbl td { padding:8px; border-bottom:1px solid var(--line-soft); vertical-align:middle; overflow-wrap:anywhere; }
.tbl tr.click { cursor:pointer; } .tbl tr.click:hover td { background:var(--line-soft); }
.tblwrap { overflow-x:auto; }
.drop { border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--muted); }
.drop.over { border-color:var(--accent); background:var(--chip); }
progress { width:100%; height:10px; accent-color:var(--accent); }

/* drawer & dialog */
.scrim { position:fixed; inset:0; background:rgba(10,12,25,.5); z-index:40; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(480px,100%); background:var(--card); z-index:41; padding:20px 16px; overflow-y:auto; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; }
dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); padding:20px; width:min(440px,calc(100% - 32px)); }
dialog::backdrop { background:rgba(10,12,25,.5); }
dialog form { display:flex; flex-direction:column; gap:12px; }
pre.preview { white-space:pre-wrap; overflow-wrap:anywhere; background:var(--bg); border-radius:10px; padding:12px; font-size:14px; margin:0; }

/* chat */
.chat { display:flex; flex-direction:column; height:calc(100vh - 150px); min-height:380px; }
#msgs { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px 2px 12px; }
.msg { max-width:min(640px,88%); padding:9px 14px; border-radius:14px; overflow-wrap:anywhere; background:var(--bubble-bot); }
.msg.me { align-self:flex-end; background:var(--bubble-me); color:#fff; } .msg.me a { color:#fff; }
.msg ul { margin:4px 0; padding-left:20px; } .msg p+p { margin-top:6px; }
.typing span { display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%; background:var(--faint); animation:b 1s infinite; }
.typing span:nth-child(2){animation-delay:.15s} .typing span:nth-child(3){animation-delay:.3s}
@keyframes b { 50% { transform:translateY(-4px); opacity:.5; } }
@media (prefers-reduced-motion: reduce) { .typing span { animation:none; } }
.compose { display:flex; gap:8px; align-items:flex-end; } .compose textarea { min-height:44px; max-height:140px; }

/* cards: workspaces/integrations */
.wsgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
.wsgrid > .card { margin:0; }
.plat { width:40px; height:40px; border-radius:10px; display:grid; place-items:center; color:#fff; font-weight:700; flex:none; }
.plat.discord { background:#5865F2; } .plat.slack { background:#4A154B; } .plat.clickup { background:#7B68EE; } .plat.web { background:#2B7A78; } .plat.soon { background:#8A90A6; }
.hd { display:flex; gap:12px; align-items:center; min-width:0; } .hd > div { min-width:0; overflow-wrap:anywhere; }
.matrix td,.matrix th { text-align:center; } .matrix td:first-child,.matrix th:first-child { text-align:left; }
.check { display:inline-flex; align-items:center; gap:6px; min-height:32px; }
.check input { width:20px; height:20px; accent-color:var(--accent); }
#mockbar { background:var(--warn-bg); color:var(--warn-ink); text-align:center; font-size:13px; padding:3px; position:sticky; top:0; z-index:60; }
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:70; max-width:calc(100% - 32px); }

@media (max-width:720px) {
  #app { flex-direction:column; }
  #side { position:fixed; z-index:50; top:0; bottom:0; left:0; height:auto; width:min(290px,86%); transform:translateX(-102%); transition:transform .2s; box-shadow:var(--shadow); }
  body.nav-open #side { transform:none; }
  body.nav-open::after { content:""; position:fixed; inset:0; background:rgba(10,12,25,.45); z-index:45; }
  #topbar { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--navy); color:#EEF0FA; position:sticky; top:0; z-index:30; }
  #topbar button { background:none; border:1px solid #4a5080; color:#fff; border-radius:8px; min-height:40px; min-width:40px; }
  #topbar .t { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #content { padding:16px 16px 32px; }
  #content > h1 { font-size:22px; }
  #login .pitch { padding:32px 16px; } #login .pitch h1 { font-size:26px; }
  .chat { height:calc(100vh - 190px); }
  .tbl.stack thead { display:none; }
  .tbl.stack tr { display:block; border-bottom:1px solid var(--line); padding:6px 0; }
  .tbl.stack td { display:block; border:0; padding:2px 4px; }
}
</style>
</head>

</dialog>
