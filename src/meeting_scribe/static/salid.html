<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salid · A little magic. A lot more done.</title>
<meta name="description" content="Salid is the AI assistant for everyday work in Discord: meeting notes, receipts, task follow-up and documents.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
  /* 70% milky white, 20% soft cosmic colour, 10% luminous accents (see the creative brief). */
  :root {
    --bg: #FAF9F6; --bg-2: #F3F1EC; --ink: #1B1F3B; --muted: #5B6078; --faint: #8A8FA6;
    --line: #E6E3DC; --indigo: #2B2F7A; --indigo-2: #4A4FBF; --lavender: #B9B4F2; --sky: #BFD6F6;
    --gold: #D9C28A; --surface: rgba(255,255,255,.72);
    --shadow: 0 10px 30px rgba(43,47,122,.08), 0 1px 2px rgba(43,47,122,.06);
    --ease: cubic-bezier(.22,.8,.3,1);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6;
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", "Segoe UI", Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: var(--indigo-2); }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--indigo-2); outline-offset: 3px; border-radius: 8px; }
  .wrap { width: min(1120px, 100% - 32px); margin: 0 auto; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------- navigation ---------- */
  .nav { position: sticky; top: 0; z-index: 20; background: rgba(250,249,246,.82);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
  .nav.scrolled { border-bottom-color: var(--line); }
  .nav .wrap { display: flex; align-items: center; gap: 24px; min-height: 64px; }
  .logo { display: flex; align-items: center; gap: 10px; color: var(--indigo); text-decoration: none; font-weight: 700; font-size: 18px; }
  .logo .mark { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--indigo-2), #7A6CF0); color: #fff; font-size: 15px; box-shadow: 0 4px 12px rgba(74,79,191,.3); }
  .links { display: flex; gap: 4px; margin-left: auto; }
  .links a { color: var(--indigo); text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 500; font-size: 15px; }
  .links a:hover { background: rgba(74,79,191,.08); }
  .langsw { display: flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; background: #fff; }
  .langsw button { border: 0; background: none; padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .langsw button[aria-pressed="true"] { background: var(--indigo); color: #fff; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 12px;
    font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid transparent;
    transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s; }
  .btn.primary { background: var(--indigo); color: #fff; box-shadow: 0 6px 18px rgba(43,47,122,.25); }
  .btn.primary:hover { background: #22265F; transform: translateY(-1px); box-shadow: 0 10px 24px rgba(43,47,122,.3); }
  .btn.primary:active { transform: translateY(0); box-shadow: 0 3px 10px rgba(43,47,122,.25); }
  .btn.primary[aria-disabled="true"] { background: #C9CBE0; box-shadow: none; cursor: not-allowed; pointer-events: none; }
  .btn.ghost { color: var(--indigo); border-color: var(--line); background: #fff; }
  .btn.ghost:hover { border-color: var(--lavender); background: #FBFAFF; }
  .btn.small { padding: 8px 14px; font-size: 14px; border-radius: 10px; }
  .menu-btn { display: none; margin-left: auto; border: 1px solid var(--line); background: #fff; border-radius: 10px; width: 40px; height: 40px; }
  .menu-btn span { display: block; width: 18px; height: 2px; background: var(--indigo); margin: 3px auto; border-radius: 2px; }
  @media (max-width: 760px) {
    .links { display: none; position: absolute; top: 64px; left: 0; right: 0; flex-direction: column; padding: 12px 16px 16px;
      background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
    .links.open { display: flex; }
    .nav .cta-top { display: none; }
    .menu-btn { display: block; }
    .langsw { margin-left: auto; }
    .menu-btn { margin-left: 0; }
  }

  /* ---------- hero ---------- */
  .hero { position: relative; padding: 48px 0 24px; overflow: hidden; }
  .hero .wrap { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 32px; align-items: center; min-height: 520px; }
  .copy { display: flex; flex-direction: column; gap: 20px; max-width: 520px; opacity: 0; transform: translateY(12px);
    animation: rise .8s var(--ease) .2s forwards; }
  .eyebrow { font-size: 13px; letter-spacing: .18em; font-weight: 600; color: var(--indigo-2); }
  .copy h1 { font-size: clamp(34px, 5vw, 56px); line-height: 1.12; font-weight: 700; letter-spacing: -.01em; }
  .copy p { font-size: 18px; color: var(--muted); max-width: 460px; }
  .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
  .trust { font-size: 13px; color: var(--faint); }

  /* The scene: the official rendered film (portal opens, the cat hops out, portal closes) with the
     final still underneath, so a slow network, a failed file or reduced motion all show the cat. */
  .stage { position: relative; width: 100%; max-width: 620px; margin: 0 auto; padding: 36px 0 44px; }
  .scene { position: relative; aspect-ratio: 1812 / 840; border-radius: 22px; overflow: hidden; background: #EFEBE4;
    box-shadow: 0 24px 60px rgba(43,47,122,.16), 0 2px 6px rgba(43,47,122,.08); transform: translateY(14px); opacity: 0;
    animation: rise .9s var(--ease) .1s forwards; }
  .scene img, .scene video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .scene video { opacity: 0; transition: opacity .4s; }
  .scene.rolling video { opacity: 1; }
  .scene::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); pointer-events: none; }
  .halo { position: absolute; left: 50%; top: 50%; width: 80%; height: 80%; transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(ellipse, rgba(185,180,242,.35), rgba(191,214,246,.18) 45%, transparent 70%); filter: blur(28px); z-index: -1; }

  /* callouts: small, light labels placed around the cat */
  .callout { position: absolute; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--surface);
    border: 1px solid rgba(255,255,255,.9); box-shadow: var(--shadow); backdrop-filter: blur(6px); max-width: 220px;
    opacity: 0; transform: translateY(10px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
  .callout svg { width: 22px; height: 22px; flex: none; color: var(--indigo-2); }
  .callout strong { display: block; font-size: 14px; line-height: 1.3; }
  .callout span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.35; }
  /* corners of the scene, slightly outside it so nothing covers the cat */
  .c1 { left: -8px; top: 0; } .c2 { right: -8px; top: 8px; } .c3 { left: 4px; bottom: 6px; } .c4 { right: 4px; bottom: -2px; }

  /* ----- the sequence: "a" while the film plays, "e" reveals the callouts, "idle" is the default
     (no JS, reduced motion, a film that cannot play) ----- */
  [data-stage="a"] .callout { opacity: 0; transform: translateY(10px); }
  [data-stage="e"] .callout, [data-stage="idle"] .callout { opacity: 1; transform: none; }
  [data-stage="e"] .c2 { transition-delay: .18s; } [data-stage="e"] .c3 { transition-delay: .36s; } [data-stage="e"] .c4 { transition-delay: .54s; }

  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .copy, .scene, .callout { opacity: 1; transform: none; }
  }
  @media (max-width: 860px) {
    .hero .wrap { grid-template-columns: 1fr; min-height: 0; }
    .copy { max-width: none; }
    .stage { max-width: 560px; padding: 28px 0 36px; }
    .callout { max-width: 180px; padding: 8px 10px; }
    .callout span { display: none; }
  }
  @media (max-width: 480px) {
    .c1 { left: 0; top: 0; } .c2 { right: 0; top: 0; } .c3 { left: 0; bottom: 0; } .c4 { right: 0; bottom: 0; }
    .callout { max-width: 150px; } .callout strong { font-size: 12.5px; }
  }

  /* ---------- sections ---------- */
  section { padding: 72px 0; }
  .section-h { max-width: 620px; margin-bottom: 36px; display: flex; flex-direction: column; gap: 10px; }
  .section-h h2 { font-size: clamp(26px, 3.4vw, 36px); line-height: 1.2; letter-spacing: -.01em; }
  .section-h p { color: var(--muted); font-size: 17px; }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  .step { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
  .step .n { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; color: var(--indigo);
    background: linear-gradient(135deg, #EEF0FF, #E6F0FF); }
  .step h3 { font-size: 17px; } .step p { color: var(--muted); font-size: 15px; }
  .step code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; background: #EEF0FF; color: var(--indigo); padding: 2px 7px; border-radius: 6px; }
  .features { background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 8px;
    transition: transform .2s var(--ease), box-shadow .2s var(--ease); }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .card .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--indigo-2);
    background: linear-gradient(135deg, #EEF0FF, #F3F0FF); margin-bottom: 6px; }
  .card .ic svg { width: 22px; height: 22px; }
  .card h3 { font-size: 17px; } .card p { color: var(--muted); font-size: 14.5px; }
  .teams .wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 40px; align-items: center; }
  .teams ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; }
  .teams li { display: flex; gap: 12px; align-items: flex-start; font-size: 15.5px; }
  .teams li svg { width: 20px; height: 20px; flex: none; color: var(--indigo-2); margin-top: 3px; }
  .teams li span { color: var(--muted); }
  .teams li b { color: var(--ink); font-weight: 600; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 28px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
  .panel h3 { font-size: 20px; } .panel p { color: var(--muted); font-size: 15px; }
  .panel .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; background: #EEF0FF; color: var(--indigo); font-weight: 500; }
  @media (max-width: 860px) { .teams .wrap { grid-template-columns: 1fr; } }
  .pill.ok { background: #DDF3E8; color: #0B6B45; }
  .card .pill { align-self: flex-start; margin-bottom: 2px; }
  .plans-s { background: var(--bg-2); }
  .plan-c .price { font-weight: 600; color: var(--indigo); }
  .plan-c.soon { border-style: dashed; background: transparent; box-shadow: none; }
  .plan-c .btn { margin-top: auto; align-self: flex-start; }
  .fine { margin-top: 18px; font-size: 13.5px; color: var(--faint); max-width: 720px; }
  .entry { background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%); }
  .card.go { text-decoration: none; color: inherit; }
  .card.go .more { margin-top: auto; padding-top: 10px; color: var(--indigo-2); font-size: 14.5px; }
  .card.go:hover .more { text-decoration: underline; }
  .final { text-align: center; padding: 80px 0 90px; }
  .final .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .final h2 { font-size: clamp(28px, 4vw, 42px); line-height: 1.15; }
  .final p { color: var(--muted); font-size: 17px; max-width: 520px; }
  footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--faint); font-size: 13.5px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; }
  footer a { color: var(--muted); text-decoration: none; } footer a:hover { color: var(--indigo); }
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Salid"><span class="mark" aria-hidden="true">S</span><span data-i18n="brand"></span></a>
    <nav class="links" id="links" data-i18n-attr="aria-label:nav_aria">
      <a href="#platforms" data-i18n="nav_explore"></a>
      <a href="#features" data-i18n="nav_features"></a>
      <a href="#plans" data-i18n="nav_plans"></a>
      <a href="#teams" data-i18n="nav_teams"></a>
      <a href="/hub" data-i18n="nav_hub"></a>
    </nav>
    <div class="langsw" role="group" data-i18n-attr="aria-label:lang_switch_aria">
      <button type="button" data-lang="th" data-i18n="lang_th"></button>
      <button type="button" data-lang="en" data-i18n="lang_en"></button>
    </div>
    <a class="btn primary small cta-top" href="/start" data-i18n="cta_signup"></a>
    <button type="button" class="menu-btn" id="menu" aria-expanded="false" aria-controls="links" data-i18n-attr="aria-label:menu_aria"><span></span><span></span><span></span></button>
  </div>
</header>

<main id="top">
  <section class="hero" id="hero" data-stage="idle">
    <div class="wrap">
      <div class="copy">
        <div class="eyebrow" data-i18n="eyebrow"></div>
        <h1 data-i18n="headline"></h1>
        <p data-i18n="sub"></p>
        <div class="ctas">
          <a class="btn primary" href="/start" data-i18n="cta_signup"></a>
          <a class="btn ghost" href="#platforms" data-i18n="cta_explore"></a>
        </div>
        <div class="trust" data-i18n="trust"></div>
      </div>

      <div class="stage">
        <div class="halo" aria-hidden="true"></div>
        <!-- Official Salid assets live in static/salid/. The film (cat-portal.mp4 / .webm) plays once,
             muted; the still underneath is the final frame, so the cat is there before, during and
             after it, and whenever the film cannot play. -->
        <div class="scene" id="scene">
          <img class="still" src="/static/salid/cat-hero.webp" width="1400" height="649" data-i18n-attr="alt:cat_alt" fetchpriority="high">
          <video id="film" muted playsinline preload="auto" poster="/static/salid/cat-portal.webp" aria-hidden="true" tabindex="-1">
            <source src="/static/salid/cat-portal.webm" type="video/webm">
            <source src="/static/salid/cat-portal.mp4" type="video/mp4">
          </video>
        </div>

        <!-- Feature callouts: only capabilities present in the codebase (see salid/guild_settings.FEATURES). -->
        <div class="callout c1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg><div><strong data-i18n="co1_t"></strong><span data-i18n="co1_d"></span></div></div>
        <div class="callout c2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg><div><strong data-i18n="co2_t"></strong><span data-i18n="co2_d"></span></div></div>
        <div class="callout c3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg><div><strong data-i18n="co3_t"></strong><span data-i18n="co3_d"></span></div></div>
        <div class="callout c4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4Z"/><path d="M8 9h8M8 13h5"/></svg><div><strong data-i18n="co4_t"></strong><span data-i18n="co4_d"></span></div></div>
      </div>
    </div>
  </section>

  <section id="platforms">
    <div class="wrap">
      <div class="section-h"><h2 data-i18n="pf_h"></h2><p data-i18n="pf_p"></p></div>
      <div class="grid">
        <div class="card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-4l-4 3v-3H7a3 3 0 0 1-3-3Z"/><path d="M9 11h.01M15 11h.01"/></svg></div><span class="pill ok" data-i18n="pf_now"></span><h3 data-i18n="pf1_t"></h3><p data-i18n="pf1_d"></p></div>
        <div class="card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3M3 9h18"/></svg></div><span class="pill ok" data-i18n="pf_now"></span><h3 data-i18n="pf2_t"></h3><p data-i18n="pf2_d"></p></div>
        <div class="card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg></div><span class="pill ok" data-i18n="pf_now"></span><h3 data-i18n="pf3_t"></h3><p data-i18n="pf3_d"></p></div>
        <div class="card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/><path d="M9 12h6M12 9v6"/></svg></div><span class="pill" data-i18n="pf_org"></span><h3 data-i18n="pf4_t"></h3><p data-i18n="pf4_d"></p></div>
      </div>
    </div>
  </section>

  <section id="explore">
    <div class="wrap">
      <div class="section-h"><h2 data-i18n="ex_h"></h2><p data-i18n="ex_p"></p></div>
      <div class="steps">
        <div class="step"><div class="n">1</div><h3 data-i18n="ex1_t"></h3><p data-i18n="ex1_d"></p></div>
        <div class="step"><div class="n">2</div><h3 data-i18n="ex2_t"></h3><p data-i18n-html="ex2_d"></p></div>
        <div class="step"><div class="n">3</div><h3 data-i18n="ex3_t"></h3><p data-i18n="ex3_d"></p></div>
      </div>
    </div>
  </section>

  <section class="features" id="features">
    <div class="wrap">
      <div class="section-h"><h2 data-i18n="ft_h"></h2><p data-i18n="ft_p"></p></div>
      <div class="grid">
        <div class="card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg></div><h3 data-i18n="f1_t"></h3><p data-i18n="f1_d"></p></div>

</script>
<script>
// ---------- language (Thai / English) ----------
// Priority: saved manual choice ("salid-language") -> browser primary subtag -> English.
const LANG_KEY = "salid-language";
const SUPPORTED = ["th", "en"];
const $ = (id) => document.getElementById(id);
const I18N = JSON.parse($("i18n-data").textContent);
function readLang(op, v) {
  try {
    if (op === "set") { localStorage.setItem(LANG_KEY, v); return null; }
    const s = localStorage.getItem(LANG_KEY);
    return SUPPORTED.includes(s) ? s : null;
  } catch { return null; } // storage blocked: the choice then lasts until reload
}
function browserLang() {
  const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
  for (const l of list) {
    const primary = String(l).toLowerCase().split("-")[0];
    if (SUPPORTED.includes(primary)) return primary;
  }
  return "en";
}
let lang = readLang("get") || browserLang();
function t(key) { const e = I18N[key]; return e ? (e[lang] ?? e.en) : key; }
function applyStatic() {
  document.documentElement.lang = lang;
  document.title = t("title");
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll("[data-i18n-attr]")) {
    for (const pair of el.dataset.i18nAttr.split(";")) { const [attr, key] = pair.split(":"); el.setAttribute(attr, t(key)); }
  }
  for (const el of document.querySelectorAll("[data-lang]")) el.setAttribute("aria-pressed", String(el.dataset.lang === lang));
  markInvite();
}
function setLang(l) { if (!SUPPORTED.includes(l)) return; lang = l; readLang("set", l); applyStatic(); }
for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => setLang(b.dataset.lang));

// The invite URL is filled in by the server from SALID_DISCORD_CLIENT_ID. Never fabricate one:
// with no client id the buttons say so and are inert.
function markInvite() {
  for (const a of document.querySelectorAll("[data-invite]")) {
    const ok = a.getAttribute("href").startsWith("https://discord.com/");
    a.setAttribute("aria-disabled", String(!ok));
    if (ok) { a.target = "_blank"; a.rel = "noopener"; a.textContent = t("cta_add"); }
    else { a.removeAttribute("target"); a.textContent = t("cta_unconfigured"); }
  }
}
applyStatic();

// ---------- navigation ----------
const nav = $("nav"), links = $("links"), menu = $("menu");
addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 8), { passive: true });
menu.addEventListener("click", () => {
  const open = links.classList.toggle("open");
  menu.setAttribute("aria-expanded", String(open));
});
links.addEventListener("click", (e) => { if (e.target.tagName === "A") { links.classList.remove("open"); menu.setAttribute("aria-expanded", "false"); } });

// ---------- hero sequence: the film plays once ("a"), then the callouts appear ("e" -> "idle") ----------
// The final state is the markup default, so the page is complete without JS, with reduced motion, or
// when the film is missing or cannot autoplay. The copy and CTA never wait for the film.
const hero = $("hero"), scene = $("scene"), film = $("film");
let stage = "idle", revealed = false;
function setStage(s) { stage = s; hero.dataset.stage = s; }
function reveal() {
  if (revealed) return;
  revealed = true;
  setStage("e");
  setTimeout(() => setStage("idle"), 1200);
}
function playFilm() {
  setStage("a");
  const guard = setTimeout(reveal, 2500); // nothing playing after 2.5 s: show the still and move on
  film.addEventListener("playing", () => { clearTimeout(guard); scene.classList.add("rolling"); }, { once: true });
  film.addEventListener("ended", reveal, { once: true });
  film.addEventListener("error", reveal, { once: true });
  film.querySelectorAll("source")[1].addEventListener("error", reveal, { once: true }); // no file at all
  const p = film.play();
  if (p && p.catch) p.catch(reveal); // autoplay blocked
}
if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
  setStage("idle");
} else {
  try { playFilm(); } catch (err) { reveal(); }
}
</script>
