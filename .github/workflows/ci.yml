# CI for every pull request and every push to main: lint, offline tests, secret scan.
# Live tests (-m live, real Vertex/Discord) never run here; pytest deselects them by default.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    name: Tests (pytest, offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same system libraries as Dockerfile.salid: voice (libopus), media (ffmpeg),
      # Thai PDFs (fonts-thai-tlwg) and the promo kit (libfribidi).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus0 ffmpeg fonts-thai-tlwg libfribidi0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install (uv.lock must be up to date)
        run: uv sync --locked
      - name: pytest
        run: uv run pytest -q

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          v=8.30.1
          f=gitleaks_${v}_linux_x64.tar.gz
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/${f}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Scan the commits of this change
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            ./gitleaks git --redact --no-banner --log-opts="$BASE..HEAD" .
          else
            ./gitleaks git --redact --no-banner .
          fi
