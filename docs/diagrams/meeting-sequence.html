<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Scribe — meeting lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Meeting Scribe</p>
    <h1>From “Record” to a Discord summary</h1>

    <!-- Replace meeting-sequence with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="meeting-sequence-title meeting-sequence-desc">
        <title id="meeting-sequence-title">Meeting Scribe: one meeting from recording to Discord summary</title>
        <desc id="meeting-sequence-desc">Sequence of calls between the host browser, Cloud Run, Gemini on Vertex AI, Pub/Sub and Discord: a loop that uploads and transcribes 45-second audio chunks, then a Stop that triggers a Pub/Sub-driven summary posted to Discord.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->

          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        <line x1="160" y1="60" x2="160" y2="652" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
          <line x1="420" y1="60" x2="420" y2="652" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
          <line x1="680" y1="60" x2="680" y2="652" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
          <line x1="940" y1="60" x2="940" y2="652" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
          <line x1="1160" y1="60" x2="1160" y2="652" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
          <rect x="112" y="120" width="616" height="272" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
          <rect x="112" y="120" width="48" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
          <text x="136" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
          <text x="124" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[every ~45 s while recording]</text>
          <line x1="160" y1="96" x2="420" y2="96" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
          <line x1="160" y1="184" x2="420" y2="184" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
          <line x1="420" y1="288" x2="680" y2="288" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
          <line x1="680" y1="328" x2="420" y2="328" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <line x1="420" y1="368" x2="160" y2="368" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <line x1="160" y1="432" x2="420" y2="432" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
          <line x1="420" y1="472" x2="940" y2="472" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
          <line x1="940" y1="512" x2="420" y2="512" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
          <line x1="420" y1="552" x2="680" y2="552" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
          <line x1="680" y1="592" x2="420" y2="592" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <line x1="420" y1="632" x2="1160" y2="632" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
          <path d="M 420,224 H 448 Q 456,224 456,232 V 240 Q 456,248 448,248 H 424" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
          <rect x="194" y="76" width="192" height="12" rx="2" fill="#f5f5f5"/><text x="290" y="85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" font-weight="600" fill="#4f5d75">CREATE MEETING<tspan dx="6" font-weight="400" fill="#4f5d75" letter-spacing="0">POST /api/meetings</tspan></text>
          <rect x="214" y="164" width="152" height="12" rx="2" fill="#f5f5f5"/><text x="290" y="173" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" font-weight="600" fill="#4f5d75">UPLOAD CHUNK<tspan dx="6" font-weight="400" fill="#4f5d75" letter-spacing="0">POST /chunks</tspan></text>
          <rect x="462" y="268" width="176" height="12" rx="2" fill="#f5f5f5"/><text x="550" y="277" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" font-weight="600" fill="#4f5d75">TRANSCRIBE<tspan dx="6" font-weight="400" fill="#4f5d75" letter-spacing="0">audio + prior lines</tspan></text>
          <rect x="470" y="308" width="160" height="12" rx="2" fill="#f5f5f5"/><text x="550" y="317" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" font-weight="600" fill="#4f5d75">UTTERANCES<tspan dx="6" font-weight="400" fill="#4f5d75" letter-spacing="0">speaker-labelled</tspan></text>
          <rect x="226" y="348" width="128" height="12" rx="2" fill="#f5f5f5"/><text x="290" y="357" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" font-weight="600" fill="#4f5d75">TRANSCRIPT<tspan dx="6" font-weight="400" fill="#4f5d75" letter-spacing="0">shown live</tspan></text>
          <rect x="238" y="412" width="104" height="12" rx="2" fill="#f5f5f5"/><text x="290" y="421" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" font-weight="600" fill="#4f5d75">STOP<tspan dx="6" font-weight="400" fill="#4f5d75" letter-spacing="0">POST /finish</tspan></text>
          <rect x="754" y="452" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="810" y="461" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" font-weight="600" fill="#4f5d75">PUBLISH<tspan dx="6" font-weight="400" fill="#4f5d75" letter-spacing="0">meeting_id</tspan></text>
          <rect x="734" y="492" width="152" height="12" rx="2" fill="#f5f5f5"/><text x="810" y="501" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" font-weight="600" fill="#4f5d75">PUSH FINALIZE<tspan dx="6" font-weight="400" fill="#4f5d75" letter-spacing="0">OIDC-signed</tspan></text>
          <rect x="454" y="532" width="192" height="12" rx="2" fill="#f5f5f5"/><text x="550" y="541" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" font-weight="600" fill="#4f5d75">ADK SUMMARIZE<tspan dx="6" font-weight="400" fill="#4f5d75" letter-spacing="0">3.5 Flash → 3.1 Pro</tspan></text>
          <rect x="494" y="572" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="550" y="581" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" font-weight="600" fill="#4f5d75">SUMMARY<tspan dx="6" font-weight="400" fill="#4f5d75" letter-spacing="0">structured</tspan></text>
          <rect x="974" y="612" width="152" height="12" rx="2" fill="#f5f5f5"/><text x="1050" y="621" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em" font-weight="600" fill="#2d3142">POST SUMMARY<tspan dx="6" font-weight="400" fill="#4f5d75" letter-spacing="0">embed + .txt</tspan></text>
          <rect x="468" y="229" width="184" height="14" rx="2" fill="#f5f5f5"/><text x="474" y="239" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" font-weight="600" fill="#4f5d75">TO_FLAC · GCS<tspan dx="6" font-weight="400" letter-spacing="0">16 kHz FLAC → GCS</tspan></text>
          <rect x="80" y="12" width="160" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="80" y="12" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="160" y="34" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Host browser</text>
          <text x="160" y="50" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Chrome · tab audio + mic</text>
          <rect x="340" y="12" width="160" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="340" y="12" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="420" y="34" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloud Run</text>
          <text x="420" y="50" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI · Firestore · GCS</text>
          <rect x="600" y="12" width="160" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="600" y="12" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

          <text x="680" y="50" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3.5 Flash · 3.1 Pro</text>
          <rect x="860" y="12" width="160" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="860" y="12" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

          <text x="940" y="50" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">topic meeting-finalize</text>
          <rect x="1080" y="12" width="160" height="48" rx="6" fill="#f5f5f5"/>

          <text x="1160" y="50" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">webhook · Secret Manager</text>
          <line x1="40" y1="672" x2="1240" y2="672" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
          <text x="40" y="692" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
          <line x1="140" y1="688" x2="172" y2="688" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
          <text x="184" y="692" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Request</text>
          <line x1="274" y1="688" x2="306" y2="688" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <text x="318" y="692" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Return</text>
          <line x1="402" y1="688" x2="434" y2="688" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
          <text x="446" y="692" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Gemini call</text>
          <line x1="560" y1="688" x2="592" y2="688" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
          <text x="604" y="692" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Headline</text>
          <text x="1240" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="end" font-style="normal">Firestore and Cloud Storage sit behind Cloud Run and are not drawn as lifelines.</text>

              </svg>
    </div>
  </div>
</body>
</html>
